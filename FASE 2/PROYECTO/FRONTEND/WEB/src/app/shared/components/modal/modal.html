@if (open()) {
  <div class="backdrop" (click)="onBackdrop($event)">
    <div
      #dialogo
      class="dialog"
      [class.is-wide]="wide() && ancho() === 'normal'"
      [class.is-importacion]="ancho() === 'importacion'"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="'modal-title'"
      tabindex="-1"
    >
      <header class="head">
        <h2 id="modal-title">{{ titulo() }}</h2>
        <button type="button" class="close" (click)="closed.emit()" aria-label="Cerrar">
          <app-icon name="close" [size]="18" />
        </button>
      </header>
      <div class="body">
        <ng-content />
      </div>
    </div>
  </div>
}
