<app-card>
  <div class="kpi">
    <div>
      <p class="label">{{ label() }}</p>
      <p class="value">{{ value() }}</p>
      @if (sub()) {
        <p class="sub">{{ sub() }}</p>
      }
    </div>
    @if (mostrarAnillo()) {
      <app-progress-ring
        [value]="progress() ?? 0"
        [color]="progressColor()"
        [label]="label() + ' ' + value()"
      />
    } @else if (icon(); as iconName) {
      <div class="icon" [attr.data-tone]="tone()">
        <app-icon [name]="iconName" [size]="18" />
      </div>
    }
  </div>
</app-card>
