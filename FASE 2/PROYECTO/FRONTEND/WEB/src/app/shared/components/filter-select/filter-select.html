<select [value]="value()" [attr.aria-label]="label()" (change)="onChange($event)">
  @if (includeBlank()) {
    <option value="">{{ blankLabel() || label() }}</option>
  }
  @for (opcion of opciones(); track opcion.value) {
    <option [value]="opcion.value">{{ opcion.label }}</option>
  }
</select>
