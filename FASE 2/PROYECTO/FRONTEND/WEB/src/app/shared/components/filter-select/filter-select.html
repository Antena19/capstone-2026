<select
  #selector
  [value]="value()"
  [attr.aria-label]="label()"
  [disabled]="disabled()"
  (change)="onChange($event)"
>
  @if (includeBlank()) {
    <option value="" [selected]="value() === ''">{{ blankLabel() || label() }}</option>
  }
  @for (opcion of opciones(); track opcion.value) {
    <option [value]="opcion.value" [selected]="opcion.value === value()">{{ opcion.label }}</option>
  }
</select>
