<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 36 36"
  role="img"
  [attr.aria-label]="label() || 'Cumplimiento ' + porcentaje() + '%'"
>
  <circle
    class="track"
    cx="18"
    cy="18"
    [attr.r]="radio"
    fill="none"
    [attr.stroke]="track()"
    stroke-width="3.5"
  />
  <circle
    class="value"
    cx="18"
    cy="18"
    [attr.r]="radio"
    fill="none"
    [attr.stroke]="color()"
    stroke-width="3.5"
    stroke-linecap="round"
    [attr.stroke-dasharray]="dash()"
    transform="rotate(-90 18 18)"
  />
</svg>
