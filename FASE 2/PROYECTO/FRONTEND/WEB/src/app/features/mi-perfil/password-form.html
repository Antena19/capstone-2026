<form class="form" [formGroup]="form" (ngSubmit)="enviar()" autocomplete="off">
  @if (error(); as texto) {
    <p class="banner">{{ texto }}</p>
  }

  <label class="field">
    <span>Contraseña actual <abbr title="Obligatorio">*</abbr></span>
    <input
      type="password"
      formControlName="passwordActual"
      maxlength="100"
      autocomplete="current-password"
    />
    @if (mensajeCampo('passwordActual'); as mensaje) {
      <p class="hint">{{ mensaje }}</p>
    }
  </label>

  <label class="field">
    <span>Nueva contraseña <abbr title="Obligatorio">*</abbr></span>
    <input
      type="password"
      formControlName="passwordNueva"
      maxlength="100"
      autocomplete="new-password"
    />
    @if (mensajeCampo('passwordNueva'); as mensaje) {
      <p class="hint">{{ mensaje }}</p>
    }
    <p class="note">Entre 8 y 100 caracteres, con al menos una letra y un número.</p>
  </label>

  <label class="field">
    <span>Confirmar nueva contraseña <abbr title="Obligatorio">*</abbr></span>
    <input
      type="password"
      formControlName="passwordConfirm"
      maxlength="100"
      autocomplete="new-password"
    />
    @if (mensajeCampo('passwordConfirm'); as mensaje) {
      <p class="hint">{{ mensaje }}</p>
    }
  </label>

  <div class="actions">
    @if (mostrarCancelar()) {
      <app-action-button
        [label]="etiquetaCancelar()"
        variant="secondary"
        type="button"
        [disabled]="guardando()"
        (clicked)="cancelado.emit()"
      />
    }
    <app-action-button label="Actualizar contraseña" type="submit" [disabled]="guardando()" />
  </div>
</form>
