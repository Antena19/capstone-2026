<div class="page">
  <div class="wrap">
    <div class="heading">
      <div class="brand">
        <div class="logo">
          <app-icon name="bus" [size]="18" />
        </div>
        <span>Trayek</span>
      </div>
      <h1>Cambio de contraseña obligatorio</h1>
      <p>Debes actualizar tu contraseña antes de continuar usando el sistema.</p>
    </div>

    <app-password-form
      [abierto]="true"
      [guardando]="guardando()"
      [error]="error()"
      etiquetaCancelar="Cerrar sesión"
      (guardado)="guardar($event)"
      (cancelado)="cerrarSesion()"
    />
  </div>
</div>
