<div class="login">
  <section class="panel-marca" aria-label="Identidad Trayek">
    <div class="identidad">
      <div class="logo-pista">
        <div class="logo-marco">
          <img class="logo" src="logo_blanco.svg" alt="" />
        </div>
      </div>
      <p class="nombre">TRAYEK</p>
      <p class="rubro">GESTIÓN DE TRANSPORTE DE PERSONAL</p>
    </div>
    <div class="marca-pie">
      <div class="bloques">
        @for (bloque of bloques; track bloque.titulo) {
          <article>
            <h2>{{ bloque.titulo }}</h2>
            <p>{{ bloque.detalle }}</p>
          </article>
        }
      </div>
      <blockquote>{{ concepto }}</blockquote>
    </div>
  </section>

  <section class="panel-form">
    <div class="tarjeta">
      <header>
        <h1>Iniciar sesión</h1>
        <p>Sistema de gestión de transporte de personal</p>
      </header>

      <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
        <label>
          Correo electrónico
          <input
            type="email"
            formControlName="email"
            autocomplete="username"
            [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
          />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="campo-error">
              {{ form.controls.email.hasError('email') ? 'Ingrese un correo válido.' : 'Ingrese su correo electrónico.' }}
            </span>
          }
        </label>

        <label>
          Contraseña
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
          />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <span class="campo-error">Ingrese su contraseña.</span>
          }
        </label>

        <label class="recordar">
          <input type="checkbox" formControlName="recordar" />
          Recordar sesión
        </label>

        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }

        <button type="submit" [disabled]="enviando()">
          {{ enviando() ? 'Ingresando…' : 'Ingresar al sistema' }}
        </button>
      </form>

      <p class="copy">© {{ anio }} Trayek</p>
    </div>
  </section>
</div>
