<div class="login">
  <section class="panel-marca" aria-label="Identidad Trayek">
    <div class="identidad">
      <div class="logo-pista">
        <div class="logo-marco">
          <img class="logo" src="logo_blanco.svg" alt="" />
        </div>
      </div>
      <p class="nombre">TRAYEK</p>
      <p class="rubro">GESTIÓN DE TRANSPORTE DE PERSONAL</p>
    </div>
    <div class="marca-pie">
      <div class="bloques">
        @for (bloque of bloques; track bloque.titulo) {
          <article>
            <h2>{{ bloque.titulo }}</h2>
            <p>{{ bloque.detalle }}</p>
          </article>
        }
      </div>
      <blockquote>{{ concepto }}</blockquote>
    </div>
  </section>

  <section class="panel-form">
    <div class="tarjeta">
      <header>
        <h1>Iniciar sesión</h1>
        <p>Sistema de gestión de transporte de personal</p>
      </header>

      <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
        <label>
          Correo electrónico
          <input
            type="email"
            formControlName="email"
            autocomplete="username"
            [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
          />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="campo-error">
              {{ form.controls.email.hasError('email') ? 'Ingrese un correo válido.' : 'Ingrese su correo electrónico.' }}
            </span>
          }
        </label>

        <label>
          Contraseña
          <span class="campo-password">
            <input
              [type]="mostrarPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
            />
            <button
              type="button"
              class="ver-password"
              (click)="alternarPassword()"
              [attr.aria-pressed]="mostrarPassword()"
              [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (mostrarPassword()) {
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.8 10.8 0 0 1 12 5c5 0 9.3 3.1 11 7.5a11.8 11.8 0 0 1-4.1 5.1M6.1 6.1A11.7 11.7 0 0 0 1 12.5 11.8 11.8 0 0 0 8.2 18"
                  />
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12.5C3.7 8.1 8 5 12 5s8.3 3.1 10 7.5c-1.7 4.4-6 7.5-10 7.5S3.7 16.9 2 12.5Z" />
                  <circle cx="12" cy="12.5" r="3" />
                </svg>
              }
            </button>
          </span>
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <span class="campo-error">Ingrese su contraseña.</span>
          }
        </label>

        <label class="recordar">
          <input type="checkbox" formControlName="recordar" />
          Recordar sesión
        </label>

        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }

        <button type="submit" [disabled]="enviando()">
          {{ enviando() ? 'Ingresando…' : 'Ingresar al sistema' }}
        </button>
      </form>

      <p class="enlace">
        <a routerLink="/recuperar">¿Olvidaste tu contraseña?</a>
      </p>

      <p class="copy">© {{ anio }} Trayek</p>
    </div>
  </section>
</div>
