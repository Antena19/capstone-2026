<aside class="sidebar">
  <div class="brand">
    <div class="logo">
      <app-icon name="bus" [size]="18" />
    </div>
    <span class="name">Trayek</span>
  </div>

  <nav class="nav">
    @for (grupo of grupos; track grupo.titulo) {
      <p class="group-title">{{ grupo.titulo }}</p>
      @for (item of grupo.items; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <app-icon [name]="item.icon" [size]="18" />
          <span>{{ item.label }}</span>
        </a>
      }
    }
  </nav>

  <div class="user">
    <div class="avatar">{{ iniciales() }}</div>
    <div class="meta">
      <p class="email">{{ sesion()?.email }}</p>
      <p class="role">{{ rolVisible() }}</p>
    </div>
    <button type="button" class="logout" (click)="cerrarSesion()" aria-label="Cerrar sesión">
      <app-icon name="logout" [size]="18" />
    </button>
  </div>
</aside>
