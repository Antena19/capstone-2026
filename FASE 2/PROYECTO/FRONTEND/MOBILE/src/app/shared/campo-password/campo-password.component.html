<ion-input
  #campo
  fill="outline"
  [type]="tipo()"
  [label]="label()"
  labelPlacement="stacked"
  [autocomplete]="autocomplete()"
  [value]="valor"
  [disabled]="deshabilitado"
  (ionInput)="escribir($event)"
  (ionBlur)="marcarTocado()"
>
  <ion-button
    slot="end"
    fill="clear"
    type="button"
    class="ojo"
    [attr.aria-label]="etiqueta()"
    [attr.aria-pressed]="visible()"
    (mousedown)="conservarFoco($event)"
    (click)="alternar($event)"
  >
    <ion-icon slot="icon-only" [name]="icono()" aria-hidden="true" />
  </ion-button>
</ion-input>
