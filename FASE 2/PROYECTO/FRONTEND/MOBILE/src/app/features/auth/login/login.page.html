<ion-content [fullscreen]="true">
  <header class="auth-marca">
    <img src="assets/brand/logo_blanco.svg" alt="" />
    <p class="nombre">TRAYEK</p>
    <p class="rubro">GESTIÓN DE TRANSPORTE DE PERSONAL</p>
  </header>

  <div class="auth-panel">
    <section class="auth-tarjeta">
      <h1>Iniciar sesión</h1>
      <p class="lead">Ingresa con tu teléfono o correo.</p>

      <form [formGroup]="form" (ngSubmit)="enviar()">
        <ion-input
          fill="outline"
          label="Teléfono o correo"
          labelPlacement="stacked"
          formControlName="identificador"
          placeholder="+56912345678 o correo"
          autocomplete="username"
        />
        <app-campo-password
          label="Contraseña"
          autocomplete="current-password"
          formControlName="password"
        />

        @if (error()) {
          <ion-note color="danger">{{ error() }}</ion-note>
        }

        <ion-button expand="block" type="submit" [disabled]="enviando()">
          @if (enviando()) {
            <ion-spinner name="crescent" />
          } @else {
            Ingresar
          }
        </ion-button>
      </form>

      <p class="auth-enlace">
        ¿Primera vez?
        <a routerLink="/activar">Activa tu cuenta</a>
      </p>
    </section>
  </div>
</ion-content>
